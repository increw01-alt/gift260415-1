<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{title}}</title>
<meta name="description" content="{{description}}" />
<link rel="canonical" href="{{site_url}}{{path}}" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="{{site_name}}" />
<meta property="og:title" content="{{title}}" />
<meta property="og:description" content="{{description}}" />
<meta property="og:url" content="{{site_url}}{{path}}" />
<meta property="og:image" content="{{site_url}}/images/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="상품권 구입 문의 안내" />
<!-- og-image.png 는 자사 카드 일러스트(hero-cards.png)를 남색 배경에 얹어 만든 1200×630 (글자 없음) -->
<meta property="og:locale" content="ko_KR" />
<!-- 기존 사이트(같은 도메인)의 Search Console 소유확인 메타를 승계 -->
<meta name="google-site-verification" content="{{google_site_verification}}" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="/css/app.css" />
<!-- Google Tag Manager (머니플랜 {{gtm_id}}). GA4 설정 태그는 이 컨테이너 안에 있으므로 gtag.js 를 따로 넣지 않는다. -->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','{{gtm_id}}');</script>
<!-- End Google Tag Manager -->
<!-- GA4 직접 설치 자리: GTM 컨테이너에 GA4 설정 태그가 없을 때만 여기에 gtag.js 를 넣는다 (project.yaml analytics.ga4_id) -->
