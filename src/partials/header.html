<a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded focus:bg-white focus:px-3 focus:py-2">본문으로 건너뛰기</a>
<header class="site-header" data-site-header>
  <div class="mx-auto flex h-[72px] w-full max-w-6xl items-center justify-between px-5">
    <a href="/" class="flex items-center gap-2.5" aria-label="{{site_name}} 홈">
      <!-- 로고 자리: 원본 로고 파일을 받으면 <img src="/images/logo.svg" width="…" height="…" alt="{{site_name}}"> 로 교체. 로고를 새로 그리지 않는다. -->
      <span class="inline-flex h-9 w-9 items-center justify-center rounded-xl bg-navy-900 text-white" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="3"/><path d="M2 10h20"/></svg>
      </span>
      <span class="text-xl font-extrabold tracking-tight text-navy-900">{{site_name}}</span>
    </a>
    <nav aria-label="주요 메뉴" class="hidden items-center gap-1 lg:flex">
      <a href="/guide/" class="nav-link">구입 안내</a>
      <a href="/mobile-payment/" class="nav-link">휴대폰결제·소액결제</a>
      <a href="/how-to/" class="nav-link">이용 안내</a>
      <a href="/faq/" class="nav-link">자주 묻는 질문</a>
    </nav>
    <div class="hidden items-center gap-2 md:flex">
      <a href="tel:{{phone}}" class="nav-phone" data-cta="header_phone">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.8 2.1a2 2 0 0 1 2 1.7l.6 4a2 2 0 0 1-1.1 2.1l-1.9 1a12 12 0 0 0 5.7 5.7l1-1.9a2 2 0 0 1 2.1-1.1l4 .6a2 2 0 0 1 1.7 2v3.4a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2 4.3 2 2 0 0 1 4 2.1Z"/></svg>
        {{phone}}
      </a>
      <a href="{{channel_url}}" target="_blank" rel="noopener" class="btn-primary btn-pill-sm" data-cta="header_contact" data-channel-link>문의하기</a>
    </div>
    <button type="button" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-navy-900 hover:bg-brand-50 lg:hidden" aria-label="메뉴 열기" aria-expanded="false" aria-controls="mobile-menu" data-menu-toggle>
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
    </button>
  </div>
  <div id="mobile-menu" class="hidden border-t border-line bg-white lg:hidden">
    <nav aria-label="모바일 메뉴" class="mx-auto flex max-w-6xl flex-col px-5 py-3 text-base font-semibold text-ink-700">
      <a href="/guide/" class="py-3">구입 안내</a>
      <a href="/mobile-payment/" class="py-3">휴대폰결제·소액결제</a>
      <a href="/how-to/" class="py-3">이용 안내</a>
      <a href="/faq/" class="py-3">자주 묻는 질문</a>
      <a href="{{channel_url}}" target="_blank" rel="noopener" class="btn-primary mt-2 mb-2" data-cta="menu_contact" data-channel-link>문의하기</a>
    </nav>
  </div>
</header>
