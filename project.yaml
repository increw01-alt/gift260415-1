# 웹 스튜디오 프로젝트 설정 — 이 사이트 한 곳의 정보만 적는다.
# /start 가 채워 준다. 직접 고쳐도 된다.
# 값이 비어 있으면 훅과 점검 스크립트는 해당 검사를 건너뛴다(추측하지 않는다).
# 구조는 "섹션 아래 키" 2단계까지만 쓴다.

schema_version: 1

brand:
  key: "moneyplan"            # .claude/brands.tsv 의 key (예: moneyplan)
  name: "머니플랜"           # 화면에 쓰는 브랜드명
  domain: "상품권재테크.com"         # 대표 도메인. 한글 도메인은 원형 그대로 적는다
  phone: "1800-2434"          # 대표번호
  consult_url: "#consult-form"    # 상담 링크 (채널톡 등). CTA 가 가리켜야 하는 주소

site:
  type: static       # static | vite | next | astro
  root: "."          # HTML 소스가 있는 폴더 (프로젝트 루트 기준)
  build_command: ""
  output_dir: ""

deploy:
  provider: firebase-hosting
  production_branch: main   # 이 브랜치로 push 하면 실제 배포된다

analytics:           # 이 사이트에 실제로 쓰는 ID 만. 없으면 비워 둔다
  gtm_id: "GTM-K52V6QRJ"
  ga4_id: "G-3H052F1CDF"
  ads_id: "AW-17762127179"
  pixel_id: "1683722935954617"

modes:
  rigor: minimal     # minimal | standard | full  (.claude/docs/rigor-modes.md)
